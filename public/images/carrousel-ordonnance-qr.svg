<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Pharmacien scanner un QR code d'ordonnance">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#065f46" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg3)"/>
  <circle cx="1080" cy="120" r="180" fill="#059669" opacity="0.07"/>
  <circle cx="130" cy="600" r="200" fill="#0284c7" opacity="0.06"/>

  <!-- ordonnance -->
  <g filter="url(#shadow3)">
    <rect x="150" y="92" width="450" height="500" rx="22" fill="#ffffff" stroke="#d1fae5" stroke-width="3"/>
    <rect x="186" y="132" width="150" height="12" rx="6" fill="#0f766e"/>
    <rect x="186" y="158" width="250" height="8" rx="4" fill="#94a3b8" opacity="0.6"/>
    <rect x="186" y="178" width="210" height="8" rx="4" fill="#94a3b8" opacity="0.45"/>

    <circle cx="228" cy="246" r="26" fill="#ccfbf1"/>
    <path d="M218 246h20m-10-10v20" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>
    <rect x="270" y="234" width="190" height="9" rx="4.5" fill="#334155" opacity="0.8"/>
    <rect x="270" y="252" width="140" height="7" rx="3.5" fill="#94a3b8"/>

    <rect x="186" y="306" width="378" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="186" y="330" width="320" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="186" y="354" width="350" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="186" y="378" width="270" height="8" rx="4" fill="#e2e8f0"/>

    <!-- QR code stylisé -->
    <g transform="translate(392 410)" fill="#0f172a">
      <rect width="150" height="150" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
      <g>
        <rect x="16" y="16" width="36" height="36" rx="4"/>
        <rect x="22" y="22" width="24" height="24" rx="2" fill="#ffffff"/>
        <rect x="28" y="28" width="12" height="12" rx="1"/>
        <rect x="98" y="16" width="36" height="36" rx="4"/>
        <rect x="104" y="22" width="24" height="24" rx="2" fill="#ffffff"/>
        <rect x="110" y="28" width="12" height="12" rx="1"/>
        <rect x="16" y="98" width="36" height="36" rx="4"/>
        <rect x="22" y="104" width="24" height="24" rx="2" fill="#ffffff"/>
        <rect x="28" y="110" width="12" height="12" rx="1"/>
      </g>
      <g fill="#0f172a">
        <rect x="64" y="16" width="10" height="10"/><rect x="82" y="28" width="8" height="8"/><rect x="64" y="44" width="14" height="8"/>
        <rect x="16" y="64" width="8" height="14"/><rect x="34" y="70" width="12" height="8"/><rect x="56" y="62" width="10" height="10"/>
        <rect x="82" y="64" width="8" height="8"/><rect x="98" y="72" width="14" height="10"/><rect x="122" y="62" width="12" height="8"/>
        <rect x="64" y="88" width="10" height="12"/><rect x="84" y="98" width="12" height="8"/><rect x="102" y="90" width="8" height="14"/>
        <rect x="122" y="104" width="12" height="10"/><rect x="64" y="116" width="14" height="10"/><rect x="88" y="122" width="10" height="12"/>
        <rect x="16" y="122" width="10" height="12"/><rect x="34" y="116" width="8" height="18"/><rect x="50" y="132" width="10" height="8"/>
      </g>
    </g>
  </g>

  <!-- smartphone -->
  <g filter="url(#shadow3)">
    <rect x="720" y="96" width="310" height="500" rx="44" fill="#0f172a"/>
    <rect x="736" y="112" width="278" height="468" rx="34" fill="#f8fafc"/>
    <rect x="826" y="126" width="98" height="12" rx="6" fill="#0f172a"/>
    <rect x="760" y="160" width="230" height="12" rx="6" fill="#0d9488" opacity="0.8"/>
    <rect x="760" y="184" width="160" height="8" rx="4" fill="#94a3b8" opacity="0.6"/>
    <rect x="760" y="220" width="230" height="286" rx="20" fill="#ecfdf5" stroke="#99f6e4" stroke-width="3"/>

    <!-- cadre de scan -->
    <g fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round">
      <path d="M784 260v-22h22"/><path d="M966 260v-22h-22"/>
      <path d="M784 466v22h22"/><path d="M966 466v22h-22"/>
    </g>
    <g transform="translate(828 318)" fill="#0f766e">
      <rect x="0" y="0" width="12" height="12"/><rect x="16" y="0" width="8" height="12"/><rect x="28" y="8" width="12" height="8"/>
      <rect x="0" y="18" width="10" height="12"/><rect x="16" y="22" width="14" height="8"/><rect x="34" y="16" width="8" height="14"/>
      <rect x="0" y="38" width="14" height="8"/><rect x="20" y="36" width="10" height="12"/><rect x="34" y="40" width="8" height="10"/>
    </g>
    <path d="M760 430h230" stroke="#34d399" stroke-width="4" opacity="0.65">
      <animate attributeName="d" values="M760 400h230;M760 470h230;M760 400h230" dur="2.4s" repeatCount="indefinite"/>
    </path>

    <rect x="760" y="534" width="230" height="18" rx="9" fill="#0d9488"/>
    <rect x="790" y="540" width="170" height="6" rx="3" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- gélules décoratives -->
  <g transform="translate(150 30) rotate(-20)">
    <rect width="70" height="30" rx="15" fill="#fecaca"/>
    <path d="M35 0h20a15 15 0 010 30H35z" fill="#ef4444"/>
  </g>
  <g transform="translate(1080 520) rotate(25)">
    <rect width="64" height="28" rx="14" fill="#bfdbfe"/>
    <path d="M32 0h18a14 14 0 010 28H32z" fill="#3b82f6"/>
  </g>
</svg>
