<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Médecin et patient dans une clinique moderne">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f766e" flood-opacity="0.12"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#0d9488" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#dots)" opacity="0.35"/>
  <circle cx="1010" cy="150" r="250" fill="#0d9488" opacity="0.07"/>
  <circle cx="180" cy="650" r="230" fill="#059669" opacity="0.08"/>
  <circle cx="1110" cy="600" r="150" fill="#0284c7" opacity="0.06"/>

  <!-- symboles médicaux flottants -->
  <g opacity="0.5" fill="#0d9488">
    <path d="M560 110h26v26h26v26h-26v26h-26v-26h-26v-26h26z"/>
    <path d="M1080 330h18v18h18v18h-18v18h-18v-18h-18v-18h18z" opacity="0.6"/>
    <circle cx="470" cy="200" r="8" opacity="0.5"/>
    <circle cx="1130" cy="480" r="10" opacity="0.4"/>
  </g>

  <!-- patient assis -->
  <g filter="url(#shadow)">
    <ellipse cx="650" cy="650" rx="150" ry="22" fill="#0f766e" opacity="0.10"/>
    <path d="M560 650c0-95 34-150 92-150s92 55 92 150z" fill="#0d9488"/>
    <path d="M596 650c4-62 20-104 56-104s52 42 56 104z" fill="#14b8a6" opacity="0.75"/>
    <circle cx="652" cy="398" r="52" fill="#8d5524"/>
    <path d="M606 380c4-38 24-58 48-58 25 0 44 20 46 54-14-18-32-26-50-26-18 0-32 10-44 30z" fill="#1f2937"/>
    <path d="M618 430c12 10 24 14 34 14s22-4 34-14" fill="none" stroke="#6b3a1d" stroke-width="4" stroke-linecap="round"/>
    <path d="M640 410h6m18 0h6" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
    <path d="M648 428c6 5 12 5 18 0" fill="none" stroke="#6b3a1d" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- médecin debout -->
  <g filter="url(#shadow)">
    <ellipse cx="900" cy="650" rx="150" ry="22" fill="#0f766e" opacity="0.10"/>
    <path d="M800 650c0-130 38-205 102-205s102 75 102 205z" fill="url(#coat)"/>
    <path d="M856 448c14 34 28 52 46 52s32-18 46-52l-22-14-24 30-24-30z" fill="#0d9488"/>
    <path d="M856 448l-18 42 28 160h30l-20-160 10-30z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M944 448l18 42-28 160h-30l20-160-10-30z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="902" cy="330" r="54" fill="#7c4a2d"/>
    <path d="M852 312c2-42 24-66 50-66 28 0 50 24 50 66-16-24-34-34-52-34-18 0-34 12-48 34z" fill="#111827"/>
    <path d="M876 352c10 8 18 11 26 11s18-3 26-11" fill="none" stroke="#5b321c" stroke-width="4" stroke-linecap="round"/>
    <path d="M886 332h6m20 0h6" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    <path d="M894 350c6 5 12 5 18 0" fill="none" stroke="#5b321c" stroke-width="3" stroke-linecap="round"/>
    <path d="M858 420c-12 28-10 62 8 82m84-82c12 28 10 62-8 82" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <circle cx="868" cy="506" r="11" fill="#0f766e"/>
    <circle cx="936" cy="506" r="11" fill="#0f766e"/>
  </g>

  <!-- tablet de consultation -->
  <g filter="url(#shadow)">
    <rect x="706" y="430" width="150" height="104" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="4"/>
    <rect x="718" y="442" width="126" height="80" rx="8" fill="#f0fdfa"/>
    <rect x="730" y="454" width="46" height="8" rx="4" fill="#0d9488" opacity="0.65"/>
    <rect x="730" y="470" width="100" height="6" rx="3" fill="#94a3b8" opacity="0.6"/>
    <rect x="730" y="482" width="82" height="6" rx="3" fill="#94a3b8" opacity="0.45"/>
    <path d="M730 508l16-14 12 10 16-22 12 14 12-8" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- lien de coordination -->
  <path d="M704 482c-22-10-34-28-34-52" fill="none" stroke="#14b8a6" stroke-width="4" stroke-dasharray="8 10" stroke-linecap="round" opacity="0.7"/>
</svg>
